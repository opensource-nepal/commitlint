name: Commitlint

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  commitlint:
    runs-on: ubuntu-latest
    name: Commitlint
    steps:
      - uses: actions/checkout@v6

      - name: Run commitlint
        # uses: opensource-nepal/commitlint@v1
        uses: ./
        with:
          verbose: true
